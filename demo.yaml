# parameters:
  ENABLE_DEMO:
    desc: "Add demo features"
    "no":
      desc: "Nothing to do"
    "yes":
      default: true
      overrides:
        components:
          dom0:
            builder:
              layers:
                - "../../../layers/meta-demo-dom0"
        components:
          domd:
            sources:
              - type: git
                url: git://code.qt.io/yocto/meta-qt6.git
                rev: 9bd2c2ae4b4fb536975904fe494813408a2282a3
                # dev branch
              - type: git
                url: https://github.com/meta-qt5/meta-qt5.git
                rev: eb828418264a49b8d00035cb3d7b12fcea3be801
                # scrathgap branch
            builder:
              layers:
                - "../../../layers/meta-demo-domd"
                - "../meta-qt6"
              conf:
                - [IMAGE_INSTALL:append, " cluster-refgui"]
                - [IMAGE_INSTALL:append, " android-tools install-files-doma"]
                - [IMAGE_INSTALL:append, " ydotool"]
                - [PACKAGECONFIG:append:pn_qtbase, " accessibility"]
                #- [EXTRA_IMAGE_FEATURES:append ," read-only-rootfs"]
  USING_GEN3E:
    desc: "Using Gen3e SoC"
    "no":
      desc: "Nothing to do"
    salvator-xs-m3-2x4g-gen3e:
      overrides:
        variables:
          XT_DOMD_DTB_NAME: "r8a779m3-salvator-xs-2x4g-domd.dtb"
          XT_XEN_DTB_NAME: "r8a779m3-salvator-xs-2x4g-xen.dtb"
    salvator-xs-h3-4x2g-gen3e:
      overrides:
        variables:
          XT_DOMD_DTB_NAME: "r8a779m1-salvator-xs-4x2g-domd.dtb"
          XT_XEN_DTB_NAME: "r8a779m1-salvator-xs-4x2g-xen.dtb"
    h3ulcb-4x2g-gen3e:
      default: true
      overrides:
        variables:
          XT_DOMD_DTB_NAME: "r8a779m1-h3ulcb-4x2g-domd.dtb"
          XT_XEN_DTB_NAME: "r8a779m1-h3ulcb-4x2g-xen.dtb"
    h3ulcb-4x2g-kf-gen3e:
      overrides:
        variables:
          XT_DOMD_DTB_NAME: "r8a779m1-h3ulcb-4x2g-kf-domd.dtb"
          XT_XEN_DTB_NAME: "r8a779m1-h3ulcb-4x2g-kf-xen.dtb"
    h3ulcb-4x2g-ab-gen3e:
      overrides:
        variables:
          XT_DOMD_DTB_NAME: "r8a779m1-h3ulcb-4x2g-ab-domd.dtb"
